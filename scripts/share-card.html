<!doctype html>
<html lang="en">
<head>
<!-- Source for assets/share-card.jpg. Open through a local server, set the browser window to 1200 x 630, screenshot, save as JPEG. See README "Share card". Keep every line of text at 42px or larger: previews show the card at about 300 to 500px wide. The logo is assets/logo/wordmark-horizontal.svg, Dan's wordmark rearranged side to side. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; }
  :root { --spruce: #24453A; --bone: #F2F3EF; --gold: #D8AE47; --soft: rgba(242, 243, 239, .78); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--spruce); color: var(--bone); font-family: "Archivo", sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 0 56px 72px; display: grid; grid-template-rows: auto 1fr auto; }
  .mark { width: 104px; aspect-ratio: 1266 / 1332; background: var(--bone);
          -webkit-mask: url("wordmark.svg") center / contain no-repeat; mask: url("wordmark.svg") center / contain no-repeat; }
  h1 { align-self: center; font-size: 96px; font-weight: 800; font-stretch: 66%; line-height: .9; letter-spacing: -.01em; max-width: 7.2em; }
  .sub { margin-top: 22px; font-size: 27px; line-height: 1.35; color: var(--soft); max-width: 21em; text-wrap: balance; }
  .foot { display: flex; gap: 28px; align-items: baseline; font-size: 24px; color: var(--soft); }
  .foot em { font: italic 500 30px "Newsreader", serif; color: var(--bone); }
  .hoop { position: absolute; right: -40px; top: 50%; width: 560px; height: 560px; transform: translateY(-50%); }
  .hoop img { position: absolute; inset: 11%; width: 78%; height: 78%; object-fit: cover; border-radius: 50%; }
  .hoop svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; stroke: var(--bone); stroke-width: 7; }
  .clasp { fill: var(--bone); }
  .stitch { fill: none; stroke: var(--gold); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 9 7; }
</style>
</head>
<body>
<style>.card{grid-template-rows:auto 1fr;padding-top:52px}
 .lock{width:760px;aspect-ratio:3858/812;background:var(--bone);-webkit-mask:url("../assets/logo/wordmark-horizontal.svg") left top/contain no-repeat;mask:url("../assets/logo/wordmark-horizontal.svg") left top/contain no-repeat}
 h1{font-size:92px;max-width:6.6em} .sub{font-size:54px;line-height:1.12;margin-top:20px;color:var(--bone);max-width:10em;font-weight:500}</style>
<div class="card"><div class="lock"></div><div style="align-self:center"><h1>Make something worth wearing.</h1><p class="sub">Custom apparel in Courtenay, BC</p></div></div>
<div class="hoop" style="right:-110px;width:480px;height:480px"><img src="../assets/video/stitching-poster.webp" alt=""><svg viewBox="0 0 400 400" aria-hidden="true"><circle class="ring" cx="200" cy="200" r="168"/><circle class="ring" cx="200" cy="200" r="180"/>
<g class="clasp"><rect x="184" y="8" width="32" height="20" rx="3"/><rect x="176" y="2" width="48" height="8" rx="4"/></g><circle class="stitch" cx="200" cy="200" r="193"/></svg></div>
</body></html>
