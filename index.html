<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spotty and the Owl Apparel</title>
  <meta name="description" content="Custom screen printing, embroidery, vinyl, DTF and DTG printing in Comox, BC. Apparel for businesses, trades, schools, sports teams and events.">
  <meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101916" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Top bar: logo, and on wide screens the full navigation -->
  <header class="topbar" id="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#home" aria-label="Spotty and the Owl Apparel, home">
        <span class="brand-mark" data-svg="wordmark"></span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="#services">Services</a>
        <a href="#work">Work</a>
        <a href="#pricing">Pricing</a>
        <a href="#artwork">Artwork</a>
        <a href="#about">About</a>
      </nav>
      <a class="btn btn-sm topbar-cta" href="#quote">Get a quote</a>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <!-- Bottom dock for phones: always within thumb reach -->
  <div class="dock" id="dock">
    <button class="dock-menu" id="menu-open" type="button" aria-expanded="false" aria-controls="sheet">
      <span class="dock-bars" aria-hidden="true"><i></i><i></i></span>Menu
    </button>
    <a class="btn dock-cta" href="#quote">Get a quote</a>
  </div>

  <!-- Phone menu sheet -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <nav class="sheet-panel" aria-label="Menu">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#work">Work</a>
      <a href="#pricing">Pricing</a>
      <a href="#artwork">Artwork</a>
      <a href="#about">About</a>
      <a href="#policies">Our guarantee</a>
      <button class="sheet-close" type="button" data-close>Close menu</button>
    </nav>
  </div>

  <!-- Full-screen photo viewer for the Work page -->
  <dialog class="viewer" id="viewer" aria-label="Photo viewer">
    <img id="viewer-img" alt="">
    <p id="viewer-cap"></p>
    <button class="viewer-close" type="button" id="viewer-close" aria-label="Close photo">Close</button>
  </dialog>

  <script src="js/logos.js"></script>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
